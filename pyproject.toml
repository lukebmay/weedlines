[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "weedlines"
version = "0.1.0"
description = "Inkscape weed-line algorithms (frame, grid, island-hop) with live preview"
readme = "README.md"
license = { text = "GPL-3.0-or-later" }
requires-python = ">=3.9"
authors = [{ name = "Luke May" }]
keywords = ["inkscape", "vinyl", "weedlines", "plotter"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: X11 Applications :: Qt",
  "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
  "Programming Language :: Python :: 3",
  "Topic :: Multimedia :: Graphics",
]
dependencies = []

[project.optional-dependencies]
island-hop = ["pyclipper"]
dev = ["pytest", "pyclipper"]

[project.scripts]
weedlines = "weedlines.cli:main"

[project.urls]
Homepage = "https://github.com/lukebmay/weedlines"
Repository = "https://github.com/lukebmay/weedlines"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
